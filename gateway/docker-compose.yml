services:
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME:-admin}
      - RDP_PASSWORD=${RDP_PASSWORD:-changeme}
      - GATEWAY_PASSWORD=${GATEWAY_PASSWORD}
    depends_on:
      - guacd
