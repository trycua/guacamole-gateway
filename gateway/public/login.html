<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Desktop — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111; color: #ccc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 40px; width: 360px; text-align: center;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 24px; color: #eee; }
    input[type="password"] {
      width: 100%; padding: 10px 14px; font-size: 15px;
      border: 1px solid #444; border-radius: 4px;
      background: #222; color: #eee; outline: none;
      margin-bottom: 16px;
    }
    input[type="password"]:focus { border-color: #666; }
    button {
      width: 100%; padding: 10px; font-size: 15px;
      background: #2563eb; color: #fff; border: none;
      border-radius: 4px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error { color: #ef4444; font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Remote Desktop</h1>
    <div class="error" id="error">Invalid password.</div>
    <form id="form">
      <input type="password" id="pw" placeholder="Password" autofocus required>
      <button type="submit">Connect</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
      document.getElementById('error').style.display = 'block';
    }
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      window.location.href = '/?password=' + encodeURIComponent(pw);
    });
  </script>
</body>
</html>
